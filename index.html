<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELLS - 紫色方块发电机</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/stats.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/effects.css">
    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/save.css">
    <link rel="stylesheet" href="css/reset.css">
</head>
<body>
    <div class="cell-label">CELLs</div>
    
    <div class="token-display">
        <span class="token-icon">◆</span>
        <span class="token-amount" id="tokenAmount">0</span>
        <span class="token-rate" id="tokenRate">+0/s | 点击+1</span>
    </div>

    <div class="stats-panel">
        <div class="stat-row" data-stat="damage">
            <button class="info-btn" data-info="damage">!</button>
            <span class="stat-name">伤害</span>
            <div class="stat-bar-wrap">
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill" id="bar-damage" style="width: 0%"></div>
                </div>
                <button class="upgrade-btn" id="btn-damage" onclick="Game.upgrade('damage')">
                    <span id="cost-damage">10</span>
                </button>
            </div>
            <span class="level-badge" id="level-damage">Lv.0</span>
        </div>
        <div class="stat-row" data-stat="speed">
            <button class="info-btn" data-info="speed">!</button>
            <span class="stat-name">速度</span>
            <div class="stat-bar-wrap">
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill" id="bar-speed" style="width: 0%"></div>
                </div>
                <button class="upgrade-btn" id="btn-speed" onclick="Game.upgrade('speed')">
                    <span id="cost-speed">10</span>
                </button>
            </div>
            <span class="level-badge" id="level-speed">Lv.0</span>
        </div>
        <div class="stat-row" data-stat="power">
            <button class="info-btn" data-info="power">!</button>
            <span class="stat-name">强大</span>
            <div class="stat-bar-wrap">
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill" id="bar-power" style="width: 0%"></div>
                </div>
                <button class="upgrade-btn" id="btn-power" onclick="Game.upgrade('power')">
                    <span id="cost-power">10</span>
                </button>
            </div>
            <span class="level-badge" id="level-power">Lv.0</span>
        </div>
    </div>

    <div class="hint">拖动旋转 · 点击收集</div>

    <div class="levelup-flash" id="levelupFlash"></div>
    <div class="float-texts" id="floatTexts"></div>

    <div class="info-popup" id="infoPopup">
        <div class="info-popup-title" id="infoTitle">属性说明</div>
        <div class="info-popup-content" id="infoContent"></div>
    </div>

    <button class="menu-toggle" id="menuToggle" onclick="Menu.toggle()">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="menu-overlay" id="menuOverlay" onclick="Menu.toggle()"></div>

    <aside class="side-menu" id="sideMenu">
        <div class="menu-section">
            <div class="menu-title">创作者</div>
            <div class="author-card">
                <div class="author-avatar">◆</div>
                <div class="author-name">VII</div>
                <div class="author-alias">aka. Dudy_211</div>
                <div class="author-note">一个人，两个名字，无数行代码</div>
            </div>
        </div>
        <div class="menu-section">
            <div class="menu-title">联系方式</div>
            <div class="contact-list">
                <a class="contact-item" href="https://wpa.qq.com/msgrd?v=3&uin=3825731224&site=qq&menu=yes" target="_blank">
                    <div class="contact-icon qq">Q</div>
                    <div class="contact-info">
                        <div class="contact-label">QQ</div>
                        <div class="contact-value">3825731224</div>
                    </div>
                </a>
                <a class="contact-item" href="https://github.com/Dudy211/" target="_blank">
                    <div class="contact-icon github">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

                        </svg>
                    </div>
                    <div class="contact-info">
                        <div class="contact-label">GitHub</div>
                        <div class="contact-value">@Dudy211</div>
                    </div>
                </a>
            </div>
        </div>
        <div class="menu-section">
            <div class="menu-title">更多</div>
            <a href="https://github.com/Dudy211/" class="link-btn" target="_blank">
                <span>📁</span>
                查看项目源码
            </a>
        </div>
        <div class="version-info">
            <span class="version-tag">v0.4.3♡ · Level Up!</span>
            <div class="copyright">CELLS Fan Project · Not affiliated</div>
        </div>
    </aside>

    <div id="canvas-container"></div>

    <script src="cdn/three.min.js"></script>
    <script src="js/fps.js"></script>
    <script src="js/modules.js"></script>
    <script src="js/save.js"></script>
    <script src="js/reset.js"></script>
    <script src="js/cube.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
